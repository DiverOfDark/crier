[package]
name = "crier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Posts LLM-written summaries of new Hacker News and Lobsters top stories to a Telegram channel"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls", "gzip"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"
